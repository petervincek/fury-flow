name: Go Test

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build Local Goose # this is needed for functional tests and correct state of PostgreSQL
        run: make build-goose
      - name: Build Local SQLC # not needed for now
        run: make build-sqlc
      - name: Install dependencies
        run: make tidy
      - name: Run unit tests
        run: make test-unit
      - name: Run functional tests
        run: make test-functional
