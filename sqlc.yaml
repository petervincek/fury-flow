version: "2"
sql:
  - engine: "postgresql" # db we want to generate the code for
    queries: "internal/db/queries/" # source of the raw queries
    schema: "migrations/" # folder that contains our db schema
    gen:
      go:
        package: "db"
        out: "internal/db" # output, place of the generated code
        sql_package: "pgx/v5" # important if we want to use pgxpool